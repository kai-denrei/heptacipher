<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>heptacipher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- PWA: installable + offline-capable. -->
  <link rel="manifest" href="manifest.webmanifest?v=9f5fc76d" />
  <meta name="theme-color" content="#161310" />
  <link rel="apple-touch-icon" href="icon.svg?v=9f5fc76d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="heptacipher" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- cache-busting (token bumped by ./scripts/bust.sh).
       The favicon is one of 64 cb-shapes — the shape/colour rotates with
       every bust so a glance at the browser tab tells you which build is
       loaded. cb-badge.js draws the same shape as a corner widget for
       in-app confirmation, visible in both public and admin views. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="cb" content="9f5fc76d" />
  <link rel="icon" type="image/svg+xml" href="public/cb-shapes/31.svg?v=9f5fc76d" />
  <script src="public/cb-badge.js?v=9f5fc76d" defer></script>

  <style>
    :root {
      --bg: #f6f1e7;
      --paper: #fbf7ee;
      --ink: #161310;
      --accent: #8a3a2b;
      --muted: #8a847a;

      /* Quiz reveal animation knobs. All tunable in the admin panel.
         Defaults: speed 3×, bokeh 2×, no bounce, 30ms halo→crisp stagger
         (NB: scaled with speed in the animation rules so it stays proportional
         and never pokes the crisp layer past the quadrant boundary),
         200ms per-mark stride, 30px sweep-mask feather. */
      --quiz-anim-scale: 0.40;
      --quiz-anim-blur: 2.5;
      --quiz-anim-overshoot: 1.35;
      --quiz-anim-stagger: 145ms;
      --quiz-mark-stride: 20ms;
      /* Smoothness = the spatial fade-zone width on the mask's leading edge.
         Wider value = each position on the ring takes longer to transition
         from invisible to fully visible as the brush passes — reads as a
         more organic, ink-spreading reveal. Unit is px @ size=480; scales. */
      --quiz-sweep-feather: 80;

      /* Derived: each lobe Nn fits EXACTLY in its quadrant Cn — so when
         the brush finishes sweeping C4, the last mark of N4 lands at the
         same instant. The math: lobe_duration = quadrant_time, and the
         body sweep covers 4 quadrants over (sweep_duration × body_frac).
         Solving: sweep_duration = lobe_duration × 4 / body_frac.
         Using body_frac ≈ 0.937: sweep factor = 4 / 0.937 = 4.27.
         JS uses the actual per-render body_frac for the sweep itself. */
      --quiz-bloom-mark-dur: 310ms;
      --quiz-lobe-duration: calc(var(--quiz-bloom-mark-dur) + 4 * var(--quiz-mark-stride));
      --quiz-quadrant-time: var(--quiz-lobe-duration);
      --quiz-sweep-factor: 4.27;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .stage {
      flex: 1 1 0;
      min-height: 0;
      /* Bottom padding reserves space for the bottom-center keypad modal
         (≈ 280px tall on phones) so the SVG never paints behind it. The
         SVG inside uses max-height: 100% which honours this padding. */
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(305px, calc(305px + env(safe-area-inset-bottom)))
        max(8px, env(safe-area-inset-left));
      display: flex;
      /* Glyph anchored to top-center. */
      align-items: flex-start;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: var(--paper);
    }
    /* Subtle paper-grain noise behind the glyph. */
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.75;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='2' stitchTiles='stitch' seed='3'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0 0.05  0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    .stage > * { position: relative; }
    .stage svg {
      color: var(--ink);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    /* ====== Two floating modals ======
       Info modal (top-left): round/score + instruction/feedback + admin
       controls (when ?admin). Keypad modal (bottom-center): input display
       + 3×4 number pad. Both are translucent over the glyph stage. */
    .quiz-info-modal {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 9px 11px 10px;
      background: rgba(251, 247, 238, 0.86);
      backdrop-filter: blur(10px) saturate(1.15);
      -webkit-backdrop-filter: blur(10px) saturate(1.15);
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 10px;
      box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.28),
                  0 2px 5px  -2px rgba(0, 0, 0, 0.12);
      width: max-content;
      max-width: calc(100vw - 16px);
    }
    .quiz-keypad-modal {
      position: fixed;
      left: 50%;
      bottom: max(22px, calc(22px + env(safe-area-inset-bottom)));
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 12px;
      background: rgba(251, 247, 238, 0.92);
      backdrop-filter: blur(10px) saturate(1.15);
      -webkit-backdrop-filter: blur(10px) saturate(1.15);
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 12px;
      box-shadow: 0 -8px 24px -10px rgba(0, 0, 0, 0.28),
                  0 -2px 5px  -2px rgba(0, 0, 0, 0.12);
      max-width: calc(100vw - 16px);
    }
    .quiz-progress {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .quiz-progress strong { color: var(--ink); font-weight: 700; font-size: 12px; }
    .quiz-timer {
      font: 500 9px/1 ui-monospace, monospace;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: none;
      align-self: center;
      font-variant-numeric: tabular-nums;
    }
    .quiz-input {
      font: 700 30px/1 ui-monospace, monospace;
      letter-spacing: 0.22em;
      color: var(--ink);
      padding: 2px 0 4px;
      text-align: center;
    }
    .quiz-input .pending { color: var(--muted); opacity: 0.45; }
    /* Keypad: ≥44px touch targets per Apple HIG; comfortable on phones
       in portrait. 3 cols × 56px = 168px plus gaps. */
    .quiz-keypad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-auto-rows: 48px;
      gap: 6px;
      justify-content: center;
    }
    .quiz-keypad button {
      font: 600 20px/1 ui-monospace, monospace;
      padding: 0;
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 6px;
      cursor: pointer;
      transition: background 80ms, transform 60ms;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-keypad button:active:not(:disabled) { background: rgba(0, 0, 0, 0.1); transform: translateY(1px); }
    .quiz-keypad button:disabled { opacity: 0.35; cursor: not-allowed; }
    .quiz-keypad button.back { color: var(--accent); font-size: 16px; }
    @media (hover: hover) {
      .quiz-keypad button:hover:not(:disabled) { background: rgba(0, 0, 0, 0.05); }
    }
    .quiz-feedback {
      font-size: 12px;
      min-height: 14px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.35;
      max-width: 200px;
    }
    .quiz-feedback.correct { color: #1d8888; font-style: normal; font-weight: 600; }
    .quiz-feedback.wrong   { color: var(--accent); font-style: normal; font-weight: 600; }

    .quiz-summary {
      text-align: center;
      padding: 6px 4px 4px;
    }
    .quiz-summary-label { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
    .quiz-summary .score {
      font: 700 32px/1 ui-serif, Georgia, serif;
      color: var(--ink);
      margin: 4px 0 8px;
    }
    .quiz-summary button {
      font: 600 12px/1 ui-serif, Georgia, serif;
      padding: 8px 14px;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      border-radius: 3px;
      cursor: pointer;
    }
    .quiz-summary button:hover { background: var(--accent); border-color: var(--accent); }

    /* ====== Admin-only controls ====== */
    body:not(.admin) .admin-only { display: none !important; }

    .quiz-admin-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
    }
    .quiz-admin-row button {
      flex: 1;
      font: 600 10px/1 ui-monospace, monospace;
      padding: 5px 0;
      background: rgba(255,255,255,0.6);
      color: var(--ink);
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 0.05em;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-admin-row button:active { background: rgba(0,0,0,0.08); transform: translateY(1px); }

    .quiz-tune-panel {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 2px 6px;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed rgba(0,0,0,0.18);
      margin-top: 4px;
    }
    .quiz-tune-panel[hidden] { display: none; }
    .quiz-tune-panel label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .quiz-tune-panel input[type=range] { width: 78px; height: 14px; margin: 0; padding: 0; }
    .quiz-tune-panel code { font-size: 10px; min-width: 32px; text-align: right; color: var(--ink); }

    /* Vars drawer — slides in from the right when admin opens it. */
    .vars-drawer {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: 0;
      bottom: 0;
      width: min(320px, 65vw);
      padding: 10px 12px max(12px, env(safe-area-inset-bottom));
      gap: 10px;
      background: rgba(251, 247, 238, 0.94);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      backdrop-filter: blur(12px) saturate(1.1);
      border-left: 1px solid rgba(0, 0, 0, 0.14);
      box-shadow: -8px 0 24px -10px rgba(0, 0, 0, 0.28);
      overflow-y: auto;
      z-index: 20;
      display: flex;
      flex-direction: column;
    }
    .vars-drawer[hidden] { display: none; }
    .vars-drawer fieldset {
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 4px;
      padding: 8px 10px 10px;
      margin: 0 0 10px 0;
    }
    .vars-drawer legend {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 6px;
    }
    .vars-drawer label { display: block; margin: 4px 0; font-size: 13px; }
    .vars-drawer .row { display: flex; gap: 6px; align-items: center; }

    /* Deeplink button — formerly top-right entry into admin mode.
       Hidden by request so the public view has no visible affordance;
       admin access is via the `?admin` URL param only. */
    .deeplink { display: none !important; }
    .deeplink-legacy {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      z-index: 30;
      padding: 4px 8px;
      font: 500 10px/1 ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(251,247,238,0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 120ms, color 120ms;
    }
    .deeplink:hover { opacity: 1; color: var(--ink); }
    body.admin .deeplink::after { content: " · ON"; color: var(--accent); }

    /* ====== Brush-gesture reveal (mask-driven) ======
       The ring and each lobe live behind an SVG <mask> whose stroked
       path follows that element's spine. Animating stroke-dashoffset
       100 → 0 reveals the stroked region progressively → the brush
       traces the spine, revealing the ink wherever it has been.
       CSS filter:blur on the mask path softens the brush tip
       (Smoothness slider). Each position truly starts at opacity 0
       and gradually transitions to fully visible as the brush tip's
       blurred edge passes — no global pre-fade, no radial wedge. */
    @keyframes drawSpine {
      to { stroke-dashoffset: 0; }
    }

    /* Wet-drop splash — still a CSS keyframe, not mask-driven. */
    @keyframes bloomDrop {
      0%   { opacity: 0; transform: scale(0.30);                                          filter: blur(calc(6px * var(--quiz-anim-blur))); }
      40%  { opacity: 1; transform: scale(calc(1 + 0.25 * var(--quiz-anim-overshoot)));   filter: blur(calc(2px * var(--quiz-anim-blur))); }
      100% { opacity: 1; transform: scale(1);                                             filter: blur(0); }
    }

    .quiz-anim g.wet-drop {
      transform-box: fill-box;
      transform-origin: center;
    }
    .quiz-anim g.ink-halo  > g.wet-drop  { animation: bloomDrop calc(380ms * var(--quiz-anim-scale)) 0ms                                                       cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .quiz-anim g.ink-crisp > g.wet-drop  { animation: bloomDrop calc(380ms * var(--quiz-anim-scale)) calc(var(--quiz-anim-stagger) * var(--quiz-anim-scale))   cubic-bezier(0.34, 1.56, 0.64, 1) both; }

    /* Every mask path starts fully hidden (dashoffset = dasharray = 100).
       Smoothness applies as CSS filter:blur on the mask alpha — wider blur
       = softer brush tip = more gradual per-position 0→1 transition. */
    .quiz-anim .draw-spine {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      filter: blur(calc(var(--quiz-sweep-feather) * 1px));
    }

    /* Ensō: animation covers the full body+tail sweep duration. */
    .quiz-anim .draw-spine[data-element="enso"] {
      animation: drawSpine calc(var(--quiz-lobe-duration) * var(--quiz-sweep-factor) * var(--quiz-anim-scale))
                 calc(280ms * var(--quiz-anim-scale))
                 linear forwards;
    }

    /* Lobes: each one's mask animates over one quadrant, starting when the
       brush would enter that quadrant. Changing Speed/Stride retimes
       everything in sync via the existing CSS variables. */
    .quiz-anim .draw-spine[data-lobe="1"] { animation: drawSpine calc(var(--quiz-lobe-duration) * var(--quiz-anim-scale)) calc((280ms + 0 * var(--quiz-quadrant-time)) * var(--quiz-anim-scale)) linear forwards; }
    .quiz-anim .draw-spine[data-lobe="2"] { animation: drawSpine calc(var(--quiz-lobe-duration) * var(--quiz-anim-scale)) calc((280ms + 1 * var(--quiz-quadrant-time)) * var(--quiz-anim-scale)) linear forwards; }
    .quiz-anim .draw-spine[data-lobe="3"] { animation: drawSpine calc(var(--quiz-lobe-duration) * var(--quiz-anim-scale)) calc((280ms + 2 * var(--quiz-quadrant-time)) * var(--quiz-anim-scale)) linear forwards; }
    .quiz-anim .draw-spine[data-lobe="4"] { animation: drawSpine calc(var(--quiz-lobe-duration) * var(--quiz-anim-scale)) calc((280ms + 3 * var(--quiz-quadrant-time)) * var(--quiz-anim-scale)) linear forwards; }

    @media (prefers-reduced-motion: reduce) {
      .quiz-anim g.wet-drop,
      .quiz-anim .draw-spine {
        animation: none !important;
        stroke-dashoffset: 0;
      }
    }

    /* Glow on guess result. Correct = teal, wrong = dark red + slight shake. */
    @keyframes quizGlowCorrect {
      0%   { filter: drop-shadow(0 0 0 transparent); }
      30%  { filter: drop-shadow(0 0 28px #2ec5c5) drop-shadow(0 0 56px #2ec5c5); }
      100% { filter: drop-shadow(0 0 18px #2ec5c5) drop-shadow(0 0 40px rgba(46,197,197,0.6)); }
    }
    @keyframes quizGlowWrong {
      0%   { filter: drop-shadow(0 0 0 transparent); opacity: 1; }
      25%  { filter: drop-shadow(0 0 26px #5a0a0a) drop-shadow(0 0 50px #5a0a0a); opacity: 1; }
      100% { filter: drop-shadow(0 0 0 transparent); opacity: 0; }
    }
    @keyframes quizShake {
      0%   { transform: translateX(0); }
      10%  { transform: translateX(-8px); }
      20%  { transform: translateX(7px); }
      30%  { transform: translateX(-6px); }
      40%  { transform: translateX(5px); }
      55%  { transform: translateX(-3px); }
      70%  { transform: translateX(2px); }
      85%  { transform: translateX(-1px); }
      100% { transform: translateX(0); }
    }
    .svg-correct { animation: quizGlowCorrect 1.4s ease-out forwards; }
    .svg-wrong   { animation: quizGlowWrong 1.3s ease-in forwards, quizShake 0.55s ease-out; }
  </style>
</head>
<body>
  <div class="app">
    <a href="?admin" class="deeplink" id="deeplink">⚙ admin</a>

    <section class="stage" id="stage">
      <!-- SVG rendered here -->
    </section>

    <aside class="quiz-info-modal" id="quizModal">
      <div class="quiz-progress">
        <span>Round <strong id="quizRound">1</strong>/5</span>
        <span class="quiz-timer" id="quizTimer">0.0s</span>
        <span>Score <strong id="quizScore">0</strong></span>
      </div>
      <div class="quiz-feedback" id="quizFeedback">Read the ink, tap the number.</div>

      <div class="quiz-admin-row admin-only">
        <button id="quizReplayBtn" type="button" title="Replay the bloom animation on the current glyph">↻ Replay</button>
        <button id="quizTuneToggle" type="button" aria-expanded="false">Tune ▾</button>
        <button id="quizVarsToggle" type="button" aria-expanded="false">Vars ▾</button>
      </div>
      <div class="quiz-tune-panel admin-only" id="quizTunePanel" hidden>
        <label for="tuneSpeed">Speed</label>
        <input id="tuneSpeed" type="range" min="0.4" max="5" step="0.05" value="0.4" />
        <code id="tuneSpeedVal">0.40×</code>

        <label for="tuneBokeh">Bokeh</label>
        <input id="tuneBokeh" type="range" min="0" max="2.5" step="0.05" value="2.5" />
        <code id="tuneBokehVal">2.50×</code>

        <label for="tuneBounce">Bounce</label>
        <input id="tuneBounce" type="range" min="0" max="2" step="0.05" value="1.35" />
        <code id="tuneBounceVal">1.35×</code>

        <label for="tuneStagger">Stagger</label>
        <input id="tuneStagger" type="range" min="0" max="400" step="5" value="145" />
        <code id="tuneStaggerVal">145ms</code>

        <label for="tuneStride">Stride</label>
        <input id="tuneStride" type="range" min="0" max="400" step="5" value="20" />
        <code id="tuneStrideVal">20ms</code>

        <label for="tuneFeather">Smoothness</label>
        <input id="tuneFeather" type="range" min="0" max="150" step="1" value="80" />
        <code id="tuneFeatherVal">80px</code>

        <label for="tuneMarkFade">Mark fade</label>
        <input id="tuneMarkFade" type="range" min="50" max="600" step="10" value="310" />
        <code id="tuneMarkFadeVal">310ms</code>
      </div>

      <div id="quizSummary" class="quiz-summary" hidden>
        <div class="quiz-summary-label">You scored</div>
        <div class="score"><span id="quizFinalScore">0</span> / 5</div>
        <button id="quizPlayAgain">Play again</button>
      </div>
    </aside>

    <aside class="quiz-keypad-modal" id="quizKeypadModal">
      <div class="quiz-input" id="quizInput">_ _ _ _</div>
      <div class="quiz-keypad" id="quizKeypad">
        <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
        <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
        <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
        <button data-action="clear" class="back">clr</button>
        <button data-d="0">0</button>
        <button data-action="back" class="back">⌫</button>
      </div>
    </aside>

    <aside class="vars-drawer admin-only" id="varsDrawer" hidden>
      <fieldset>
        <legend>V2 shape</legend>
        <label>
          <span class="row" style="justify-content:space-between">
            <span>Lobe steepness</span>
            <code id="bulgeVal" style="font-size:11px">0.35</code>
          </span>
          <input id="bulgeSlider" type="range" min="0.05" max="1.6" step="0.05" value="0.35" style="width:100%" />
        </label>
        <label style="margin-top:8px">
          <span class="row" style="justify-content:space-between">
            <span>Space between digits</span>
            <code id="gapVal" style="font-size:11px">0.05</code>
          </span>
          <input id="gapSlider" type="range" min="0.02" max="0.18" step="0.01" value="0.05" style="width:100%" />
        </label>
        <label style="margin-top:8px">
          <span class="row" style="justify-content:space-between">
            <span>Mark spread within digit</span>
            <code id="spreadVal" style="font-size:11px">0.88</code>
          </span>
          <input id="spreadSlider" type="range" min="0" max="1" step="0.02" value="0.88" style="width:100%" />
        </label>
      </fieldset>

      <fieldset>
        <legend>V2 ink</legend>
        <label>
          <span class="row" style="justify-content:space-between">
            <span>Ink bleed</span>
            <code id="bleedVal" style="font-size:11px">2.50</code>
          </span>
          <input id="bleedSlider" type="range" min="0" max="2.5" step="0.05" value="2.5" style="width:100%" />
        </label>
        <label style="margin-top:8px">
          <span class="row" style="justify-content:space-between">
            <span>Halo darkness</span>
            <code id="haloVal" style="font-size:11px">1.60</code>
          </span>
          <input id="haloSlider" type="range" min="0" max="1.6" step="0.05" value="1.6" style="width:100%" />
        </label>
        <label style="margin-top:8px">
          <span class="row" style="justify-content:space-between">
            <span>Crisp ink opacity</span>
            <code id="crispVal" style="font-size:11px">1.00</code>
          </span>
          <input id="crispSlider" type="range" min="0" max="1" step="0.02" value="1.0" style="width:100%" />
        </label>
        <label style="margin-top:8px">
          <span class="row" style="justify-content:space-between">
            <span>Liquid wobble</span>
            <code id="wobbleVal" style="font-size:11px">20.0</code>
          </span>
          <input id="wobbleSlider" type="range" min="0" max="20" step="0.5" value="20" style="width:100%" />
        </label>
        <label style="margin-top:8px">
          <span class="row" style="justify-content:space-between">
            <span>Wobble texture (coarse ← → fine)</span>
            <code id="detailVal" style="font-size:11px">0.200</code>
          </span>
          <input id="detailSlider" type="range" min="0.01" max="0.20" step="0.005" value="0.20" style="width:100%" />
        </label>
      </fieldset>
    </aside>
  </div>

  <script type="module">
    // Service worker registration (PWA shell).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
    }

    // Cache-bust the entry module via the <meta name="cb"> token.
    const cb = document.querySelector('meta[name="cb"]')?.content || String(Date.now());
    const { renderHeptapodNumeralV2 } = await import(`./src/index.js?v=${cb}`);

    // ============================================================
    //  Admin gating
    // ============================================================
    // Public view shows only the logogram + keypad + Deeplink button.
    // Adding ?admin to the URL toggles `body.admin`, which reveals the
    // Tune/Vars buttons + the Replay button + the Vars drawer.
    const isAdmin = new URLSearchParams(location.search).has('admin');
    if (isAdmin) document.body.classList.add('admin');

    // ============================================================
    //  Render parameters
    // ============================================================
    const QUIZ_PARAMS_LOCKED = Object.freeze({
      bulgeScale: 0.35,
      digitGap: 0.05,
      markSpread: 0.88,
      bleedScale: 2.5,
      haloOpacity: 1.6,
      crispOpacity: 1.0,
      liquidWobble: 20,
      liquidDetail: 0.20,
    });
    // Live mirror — admin sliders write here, quiz reads here when varsOn.
    const liveParams = { ...QUIZ_PARAMS_LOCKED };
    let varsOn = false;

    function currentParams() {
      return varsOn ? liveParams : QUIZ_PARAMS_LOCKED;
    }

    // ============================================================
    //  Quiz state
    // ============================================================
    const QUIZ_ROUNDS = 5;
    const FEEDBACK_HOLD_CORRECT_MS = 1400;
    const FEEDBACK_HOLD_WRONG_MS = 1300;

    const quiz = {
      round: 0,
      score: 0,
      answer: 0,
      seed: 0,
      typed: '',
      awaiting: false,
    };

    // ============================================================
    //  Element refs
    // ============================================================
    const stage = document.getElementById('stage');
    const quizRoundEl = document.getElementById('quizRound');
    const quizScoreEl = document.getElementById('quizScore');
    const quizTimerEl = document.getElementById('quizTimer');
    const quizInputEl = document.getElementById('quizInput');
    const quizFeedbackEl = document.getElementById('quizFeedback');
    const quizKeypadEl = document.getElementById('quizKeypad');
    const quizSummaryEl = document.getElementById('quizSummary');
    const quizFinalScoreEl = document.getElementById('quizFinalScore');
    const quizPlayAgainBtn = document.getElementById('quizPlayAgain');
    const quizReplayBtn = document.getElementById('quizReplayBtn');
    const quizTuneToggle = document.getElementById('quizTuneToggle');
    const quizTunePanel = document.getElementById('quizTunePanel');
    const quizVarsToggle = document.getElementById('quizVarsToggle');
    const varsDrawer = document.getElementById('varsDrawer');
    const deeplinkEl = document.getElementById('deeplink');

    // Tune sliders
    const tune = {
      speed:    document.getElementById('tuneSpeed'),
      speedVal: document.getElementById('tuneSpeedVal'),
      bokeh:    document.getElementById('tuneBokeh'),
      bokehVal: document.getElementById('tuneBokehVal'),
      bounce:   document.getElementById('tuneBounce'),
      bounceVal:document.getElementById('tuneBounceVal'),
      stagger:  document.getElementById('tuneStagger'),
      staggerVal:document.getElementById('tuneStaggerVal'),
      stride:   document.getElementById('tuneStride'),
      strideVal:document.getElementById('tuneStrideVal'),
      feather:  document.getElementById('tuneFeather'),
      featherVal:document.getElementById('tuneFeatherVal'),
      markFade: document.getElementById('tuneMarkFade'),
      markFadeVal: document.getElementById('tuneMarkFadeVal'),
    };
    // Vars sliders
    const vars_ = {
      bulge: document.getElementById('bulgeSlider'),    bulgeVal: document.getElementById('bulgeVal'),
      gap: document.getElementById('gapSlider'),        gapVal: document.getElementById('gapVal'),
      spread: document.getElementById('spreadSlider'),  spreadVal: document.getElementById('spreadVal'),
      bleed: document.getElementById('bleedSlider'),    bleedVal: document.getElementById('bleedVal'),
      halo: document.getElementById('haloSlider'),      haloVal: document.getElementById('haloVal'),
      crisp: document.getElementById('crispSlider'),    crispVal: document.getElementById('crispVal'),
      wobble: document.getElementById('wobbleSlider'),  wobbleVal: document.getElementById('wobbleVal'),
      detail: document.getElementById('detailSlider'),  detailVal: document.getElementById('detailVal'),
    };

    // ============================================================
    //  Session timer — cumulative across rounds. No penalty, just a
    //  tally of total time. Starts when the ensō reveal animation
    //  ends (animationend on the ensō .draw-spine), stops when the
    //  user submits a guess, resumes on the next glyph's animationend,
    //  and resets on startQuiz.
    // ============================================================
    let timerStart = null;        // performance.now() when current run started, or null if not running
    let timerAccumulated = 0;     // ms accumulated from completed rounds
    let timerInterval = null;     // setInterval id for live display

    function startTimer() {
      if (timerStart != null) return;
      timerStart = performance.now();
      if (!timerInterval) timerInterval = setInterval(updateTimerDisplay, 100);
    }
    function stopTimer() {
      if (timerStart == null) return;
      timerAccumulated += performance.now() - timerStart;
      timerStart = null;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      updateTimerDisplay();
    }
    function resetTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      timerStart = null;
      timerAccumulated = 0;
      updateTimerDisplay();
    }
    function updateTimerDisplay() {
      let total = timerAccumulated;
      if (timerStart != null) total += performance.now() - timerStart;
      quizTimerEl.textContent = `${(total / 1000).toFixed(1)}s`;
    }

    // ============================================================
    //  Quiz controller
    // ============================================================
    // Reveal is 100% CSS-driven now — each masked element has a
    // stroke-dashoffset animation on its mask path. No rAF, no JS-built
    // mask, no cancel plumbing. See @keyframes drawSpine in the <style>.
    function startQuiz() {
      quiz.round = 0;
      quiz.score = 0;
      quiz.seed = (Math.random() * 0x1_0000_0000) | 0;
      quizSummaryEl.hidden = true;
      resetTimer();
      nextQuizRound();
    }

    function nextQuizRound() {
      if (quiz.round >= QUIZ_ROUNDS) {
        endQuiz();
        return;
      }
      quiz.round++;
      quiz.answer = Math.floor(Math.random() * 10000);
      quiz.typed = '';
      quiz.awaiting = false;
      quizFeedbackEl.textContent = `Round ${quiz.round} — read the ink, tap the number.`;
      quizFeedbackEl.classList.remove('correct', 'wrong');
      renderQuiz();
      updateQuizUI();
    }

    function renderQuiz({ animate = true } = {}) {
      const svg = renderHeptapodNumeralV2({
        number: quiz.answer,
        encoding: 'morse',
        size: 600,
        seed: quiz.seed,
        ...currentParams(),
      });
      if (animate) svg.classList.add('quiz-anim');
      stage.replaceChildren(svg);
      // Start the round timer as soon as the ensō reveal completes
      // (it's the longest-running animation). Only when animating —
      // a non-animating render (Vars drag) shouldn't restart the timer.
      if (animate) {
        const ensoSpine = svg.querySelector('.draw-spine[data-element="enso"]');
        if (ensoSpine) {
          ensoSpine.addEventListener('animationend', () => {
            if (!quiz.awaiting) startTimer();
          }, { once: true });
        }
      }
    }

    function updateQuizUI() {
      quizRoundEl.textContent = String(quiz.round);
      quizScoreEl.textContent = String(quiz.score);
      const cells = [];
      for (let i = 0; i < 4; i++) {
        cells.push(i < quiz.typed.length ? quiz.typed[i] : '_');
      }
      const filledHTML = cells.slice(0, quiz.typed.length).join(' ');
      const pendingHTML = cells.slice(quiz.typed.length).join(' ');
      quizInputEl.innerHTML = filledHTML
        + (filledHTML && pendingHTML ? ' ' : '')
        + (pendingHTML ? `<span class="pending">${pendingHTML}</span>` : '');
      [...quizKeypadEl.querySelectorAll('button')].forEach((b) => { b.disabled = quiz.awaiting; });
    }

    function quizKeypress(d) {
      if (quiz.awaiting || quiz.typed.length >= 4) return;
      quiz.typed += d;
      updateQuizUI();
      if (quiz.typed.length === 4) submitQuizGuess();
    }
    function quizBackspace() {
      if (quiz.awaiting) return;
      quiz.typed = quiz.typed.slice(0, -1);
      updateQuizUI();
    }
    function quizClear() {
      if (quiz.awaiting) return;
      quiz.typed = '';
      updateQuizUI();
    }

    function submitQuizGuess() {
      stopTimer();
      quiz.awaiting = true;
      updateQuizUI();
      const guess = Number(quiz.typed);
      const correct = guess === quiz.answer;
      if (correct) quiz.score++;
      const svg = stage.querySelector('svg');
      if (svg) {
        // Snap-reveal on early guess: removing .quiz-anim stops the CSS
        // stroke-dashoffset animation; with `forwards` fill-mode dropped
        // when the class goes, the masks revert to dashoffset=0 (fully
        // drawn) since that's the static stylesheet value... actually
        // they revert to the initial state. Force-set dashoffset=0 on
        // every draw-spine so the glow wraps the full glyph.
        svg.classList.remove('quiz-anim');
        svg.querySelectorAll('.draw-spine').forEach((p) => {
          p.style.strokeDashoffset = '0';
        });
        svg.classList.add(correct ? 'svg-correct' : 'svg-wrong');
      }
      const answerStr = String(quiz.answer).padStart(4, '0');
      quizFeedbackEl.textContent = correct
        ? `✓ ${answerStr} — correct!`
        : `✗ was ${answerStr}, you said ${quiz.typed}`;
      quizFeedbackEl.classList.add(correct ? 'correct' : 'wrong');
      quizScoreEl.textContent = String(quiz.score);
      setTimeout(nextQuizRound, correct ? FEEDBACK_HOLD_CORRECT_MS : FEEDBACK_HOLD_WRONG_MS);
    }

    function endQuiz() {
      stage.replaceChildren();
      quizFeedbackEl.textContent = '';
      quizFeedbackEl.classList.remove('correct', 'wrong');
      quizFinalScoreEl.textContent = String(quiz.score);
      quizSummaryEl.hidden = false;
    }

    // ============================================================
    //  Tune (admin) — slider listeners
    // ============================================================
    function applyTune() {
      const r = document.documentElement.style;
      r.setProperty('--quiz-anim-scale',     String(Number(tune.speed.value)));
      r.setProperty('--quiz-anim-blur',      String(Number(tune.bokeh.value)));
      r.setProperty('--quiz-anim-overshoot', String(Number(tune.bounce.value)));
      r.setProperty('--quiz-anim-stagger',   `${Number(tune.stagger.value)}ms`);
      r.setProperty('--quiz-mark-stride',    `${Number(tune.stride.value)}ms`);
      r.setProperty('--quiz-sweep-feather',  String(Number(tune.feather.value)));
      r.setProperty('--quiz-bloom-mark-dur', `${Number(tune.markFade.value)}ms`);
      tune.speedVal.textContent    = `${Number(tune.speed.value).toFixed(2)}×`;
      tune.bokehVal.textContent    = `${Number(tune.bokeh.value).toFixed(2)}×`;
      tune.bounceVal.textContent   = `${Number(tune.bounce.value).toFixed(2)}×`;
      tune.staggerVal.textContent  = `${tune.stagger.value}ms`;
      tune.strideVal.textContent   = `${tune.stride.value}ms`;
      tune.featherVal.textContent  = `${tune.feather.value}px`;
      tune.markFadeVal.textContent = `${tune.markFade.value}ms`;
    }
    Object.values(tune).filter((el) => el && el.tagName === 'INPUT').forEach((s) => s.addEventListener('input', applyTune));
    applyTune();

    // Vars (admin) — slider listeners
    function applyVars() {
      liveParams.bulgeScale   = Number(vars_.bulge.value);
      liveParams.digitGap     = Number(vars_.gap.value);
      liveParams.markSpread   = Number(vars_.spread.value);
      liveParams.bleedScale   = Number(vars_.bleed.value);
      liveParams.haloOpacity  = Number(vars_.halo.value);
      liveParams.crispOpacity = Number(vars_.crisp.value);
      liveParams.liquidWobble = Number(vars_.wobble.value);
      liveParams.liquidDetail = Number(vars_.detail.value);
      vars_.bulgeVal.textContent  = liveParams.bulgeScale.toFixed(2);
      vars_.gapVal.textContent    = liveParams.digitGap.toFixed(2);
      vars_.spreadVal.textContent = liveParams.markSpread.toFixed(2);
      vars_.bleedVal.textContent  = liveParams.bleedScale.toFixed(2);
      vars_.haloVal.textContent   = liveParams.haloOpacity.toFixed(2);
      vars_.crispVal.textContent  = liveParams.crispOpacity.toFixed(2);
      vars_.wobbleVal.textContent = liveParams.liquidWobble.toFixed(1);
      vars_.detailVal.textContent = liveParams.liquidDetail.toFixed(3);
      if (varsOn) renderQuiz({ animate: false });
    }
    Object.values(vars_).filter((el) => el && el.tagName === 'INPUT').forEach((s) => s.addEventListener('input', applyVars));

    // Toggle button wiring
    quizTuneToggle.addEventListener('click', () => {
      const wasHidden = quizTunePanel.hidden;
      quizTunePanel.hidden = !wasHidden;
      quizTuneToggle.setAttribute('aria-expanded', String(wasHidden));
      quizTuneToggle.textContent = wasHidden ? 'Tune ▴' : 'Tune ▾';
    });
    quizVarsToggle.addEventListener('click', () => {
      varsOn = !varsOn;
      varsDrawer.hidden = !varsOn;
      quizVarsToggle.setAttribute('aria-expanded', String(varsOn));
      quizVarsToggle.textContent = varsOn ? 'Vars ▴' : 'Vars ▾';
      renderQuiz({ animate: varsOn });
    });

    // Replay button: re-fire the draw animations on the current glyph.
    // Remove .quiz-anim → force reflow → re-add. The mask paths reset to
    // their stroke-dashoffset:100 starting state and animate down to 0
    // again, retracing every spine.
    quizReplayBtn.addEventListener('click', () => {
      const svg = stage.querySelector('svg');
      if (!svg) return;
      svg.classList.remove('quiz-anim', 'svg-correct', 'svg-wrong');
      // Also clear any inline stroke-dashoffset we may have set in
      // submitQuizGuess's snap-reveal so the keyframes can run cleanly.
      svg.querySelectorAll('.draw-spine').forEach((p) => {
        p.style.strokeDashoffset = '';
      });
      void svg.getBoundingClientRect();
      svg.classList.add('quiz-anim');
    });

    // Keypad — click + physical-keyboard listeners.
    quizKeypadEl.addEventListener('click', (ev) => {
      const btn = ev.target.closest('button');
      if (!btn) return;
      if (btn.dataset.d != null) quizKeypress(btn.dataset.d);
      else if (btn.dataset.action === 'back')  quizBackspace();
      else if (btn.dataset.action === 'clear') quizClear();
    });
    window.addEventListener('keydown', (ev) => {
      if (ev.key >= '0' && ev.key <= '9') quizKeypress(ev.key);
      else if (ev.key === 'Backspace') { quizBackspace(); ev.preventDefault(); }
      else if (ev.key === 'Escape') quizClear();
    });

    quizPlayAgainBtn.addEventListener('click', startQuiz);

    // Deeplink button — clicking in admin mode flips back to public.
    if (isAdmin) {
      deeplinkEl.setAttribute('href', location.pathname);
      deeplinkEl.firstChild.nodeValue = '⚙ exit admin';
    }

    // Start the first session.
    startQuiz();
  </script>
</body>
</html>
